name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lambda-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ingest_lambda

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q