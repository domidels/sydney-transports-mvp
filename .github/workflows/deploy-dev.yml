name: Deploy (dev)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Package Lambda
        run: bash ops/scripts/package_lambda.sh

      - name: Terraform apply (dev)
        working-directory: infra/terraform/environments/dev
        env:
          TF_VAR_tfnsw_api_key: ${{ secrets.TFNSW_API_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Upload Glue scripts
        run: bash ops/scripts/upload_glue_scripts.sh dev